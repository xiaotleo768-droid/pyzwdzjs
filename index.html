<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拼音花园保卫战</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3c7a32;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;touch-action:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#9bd873;border-radius:6px}
.py{font-family:"Arial Rounded MT Bold","Arial","Helvetica Neue","Helvetica",sans-serif}
.hz{font-family:"KaiTi","STKaiti","Kaiti SC","楷体","AR PL UKai CN","Noto Serif CJK SC",serif}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
button{font-family:inherit;cursor:pointer;border:none}
.btn{background:linear-gradient(#ffd25a,#f5a623);color:#6b3a00;font-size:30px;font-weight:800;padding:14px 40px;border-radius:22px;box-shadow:0 6px 0 #c47a0a,0 10px 18px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c47a0a}
.btn.green{background:linear-gradient(#8ee36a,#4fb83a);color:#fff;box-shadow:0 6px 0 #2f7d22,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.small{font-size:22px;padding:10px 24px;border-radius:16px}
.btn.gray{background:linear-gradient(#f4f4f4,#d6d6d6);color:#555;box-shadow:0 5px 0 #a8a8a8}

/* ---------- 场景 ---------- */
.sky{position:absolute;left:0;top:0;width:1280px;height:720px;background:linear-gradient(#bfe9ff 0,#e6f7ff 30%,#a8df7d 30.1%,#8acb5f 100%)}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:60%;height:140%;left:15%;top:-60%}
.cloud:after{width:40%;height:110%;left:50%;top:-40%}

/* ---------- 首页 ---------- */
#home .title{position:absolute;left:0;right:0;top:60px;text-align:center}
#home .title h1{display:inline-block;margin:0;font-size:84px;font-weight:900;color:#fff;letter-spacing:6px;padding:12px 48px;background:linear-gradient(#a8693a,#7d4a24);border-radius:28px;border:6px solid #5a3317;text-shadow:0 4px 0 #4a2a12,0 0 18px rgba(255,220,120,.5);box-shadow:0 10px 0 #4a2a12}
#home .title h1 span{color:#ffe066}
#home .title p{margin:22px 0 0;font-size:28px;color:#2d5a1e;font-weight:700}
#home .deco{position:absolute;bottom:40px;width:120px;height:132px}
#howto{position:absolute;left:300px;top:330px;width:680px;background:rgba(255,255,255,.92);border-radius:24px;padding:18px 28px;box-shadow:0 8px 20px rgba(0,0,0,.15);font-size:22px;color:#3b3b3b;line-height:1.55}
#howto b{color:#e07b00}
#howto .st{display:flex;gap:12px;align-items:flex-start;margin:6px 0}
#howto .st i{flex:none;font-style:normal;width:34px;height:34px;border-radius:50%;background:#f5a623;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px}
#homeBtns{position:absolute;left:0;right:0;top:590px;display:flex;justify-content:center;align-items:center;gap:24px}
.seg{display:flex;background:rgba(255,255,255,.85);border-radius:18px;padding:5px;gap:4px;font-size:20px;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.seg span{padding:0 8px;color:#555;font-weight:700}
.seg button{font-size:22px;padding:8px 18px;border-radius:13px;background:transparent;color:#555;font-weight:700}
.seg button.on{background:#4fb83a;color:#fff}
.iconbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.15)}

/* ---------- 选关 ---------- */
#levels h2{position:absolute;left:0;right:0;top:26px;margin:0;text-align:center;font-size:48px;color:#fff;text-shadow:0 3px 0 #2f6b1f}
#lvGrid{position:absolute;left:60px;right:60px;top:100px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.lv{position:relative;background:#fffdf3;border-radius:22px;height:148px;padding:16px 18px 12px 92px;box-shadow:0 6px 0 #c9b67a,0 10px 16px rgba(0,0,0,.15);cursor:pointer;transition:transform .1s}
.lv:active{transform:translateY(4px)}
.lv .no{position:absolute;left:16px;top:18px;width:62px;height:62px;border-radius:50%;background:linear-gradient(#8ee36a,#4fb83a);color:#fff;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #2f7d22}
.lv.rev .no{background:linear-gradient(#ffd25a,#f5a623);box-shadow:0 4px 0 #c47a0a}
.lv .nm{font-size:22px;font-weight:800;color:#3d3d3d;line-height:1.2}
.lv .sb{font-size:17px;color:#888;margin-top:6px;line-height:1.25}
.lv .stars{position:absolute;right:16px;bottom:8px;font-size:26px;letter-spacing:2px;color:#ddd}
.lv .stars b{color:#ffb400;font-weight:400}
#lvBack{position:absolute;left:24px;top:24px}

/* ---------- 游戏 ---------- */
#bar{position:absolute;left:0;top:0;width:1280px;height:150px;background:linear-gradient(#b07440,#8a552a);border-bottom:6px solid #5a3317;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:300}
#tray{position:absolute;left:8px;top:6px;height:138px;display:flex;gap:10px;align-items:flex-end}
.grp{display:flex;flex-direction:column;align-items:flex-start}
.grp .gl{font-size:17px;font-weight:800;color:#fff;padding:2px 12px;border-radius:10px;margin:0 0 5px 2px}
.grp .cards{display:flex;gap:4px}
.card{position:relative;width:70px;height:104px;border-radius:12px;background:#fffaf0;border:3px solid #ccc;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.card .ci{position:absolute;top:2px;left:50%;width:46px;height:50px;transform:translateX(-50%)}
.card .ct{font-size:31px;font-weight:800;line-height:1;margin-bottom:8px;white-space:nowrap}
.card.I{border-color:#4fb83a}.card.I .ct{color:#2f7d22}
.card.M{border-color:#a066dc}.card.M .ct{color:#6a2fb0}
.card.F{border-color:#f39a1e}.card.F .ct{color:#c45a00}
.card.W{border-color:#3d8fe0}.card.W .ct{color:#1f63ad}
.card.sel{transform:translateY(-8px) scale(1.06);box-shadow:0 0 0 4px #fff,0 0 18px 6px #ffe066}
.gl.I{background:#4fb83a}.gl.M{background:#a066dc}.gl.F{background:#f39a1e}.gl.W{background:#3d8fe0}.gl.T{background:#8a8a8a}
.card.tool{border-color:#999}
#side{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#side>*{pointer-events:auto}
#spdBtn{height:52px;padding:0 14px;border-radius:14px;background:#fff3d6;box-shadow:0 4px 0 #b88a3a;font-size:20px;font-weight:800;color:#8a552a;white-space:nowrap}
#spdBtn b{color:#e07b00}
#hearts{font-size:26px;letter-spacing:1px;line-height:1;white-space:nowrap}
#prog{position:absolute;left:16px;top:176px;width:150px;z-index:4;text-align:center;font-size:17px;color:#fff;font-weight:700;background:rgba(90,51,23,.75);padding:6px 4px;border-radius:12px;line-height:1.3}
#prog b{color:#ffe066}
#pauseBtn{width:52px;height:52px;border-radius:14px;background:#ffe9b8;font-size:26px;box-shadow:0 4px 0 #b88a3a}

#scene{position:absolute;left:0;top:0;width:1280px;height:720px}
#hlSvg{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:6}
#ents{position:absolute;inset:0;pointer-events:none}
.plant{position:absolute;width:100px;height:110px;pointer-events:none;transform-origin:50px 104px}
.plant svg{width:100%;height:100%;overflow:visible}
.plant .art{transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}
.plant.new .art{animation:grow .35s ease-out,sway 2.4s ease-in-out .35s infinite}
.plant.eat .art{animation:shake .25s linear infinite}
.plant .lab{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:#fff8dc;border:2px solid #e0a43a;border-radius:12px;padding:1px 10px;font-size:21px;font-weight:800;white-space:nowrap;color:#a35400;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.plant .lab .hz{color:#333;margin-left:4px;font-size:22px}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes grow{0%{transform:scale(.2)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:translateX(-3px)}}
.mon{position:absolute;width:110px;height:130px;pointer-events:none;transform-origin:55px 124px}
.mon .mi{position:absolute;inset:0;animation:bob .6s ease-in-out infinite}
.mon.eating .mi{animation:chomp .3s ease-in-out infinite}
.mon .sign{position:absolute;left:8px;top:56px;width:94px;height:68px;background:linear-gradient(#f7deb0,#e8c287);border:4px solid #9a6a32;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 -6px 0 rgba(140,80,20,.3),inset 0 3px 0 rgba(255,255,255,.65),0 4px 0 #6b4520,0 7px 8px rgba(0,0,0,.25)}
.mon .sign:before,.mon .sign:after{content:"";position:absolute;top:18px;width:18px;height:18px;border-radius:50%;background:var(--mc);border:3px solid var(--md)}
.mon .sign:before{left:-12px}.mon .sign:after{right:-12px}
.mon .sign b{font-size:50px;color:#222;font-weight:700;line-height:1}
.mon .sign i{font-style:normal;font-size:24px;line-height:1}
.mon .body{position:absolute;left:0;top:0;width:110px;height:114px}
.mon .hint{position:absolute;right:100%;margin-right:6px;top:64px;background:#fff;border:3px solid #3d8fe0;color:#1f63ad;font-size:32px;font-weight:800;padding:2px 14px;border-radius:14px;white-space:nowrap;display:none}
.mon .hint.on{display:block;animation:pop .25s}
.mon.die .mi{animation:die .6s forwards}
.mon.home .mi{animation:sneak .6s forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes chomp{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg) translateX(-4px)}}
@keyframes die{0%{opacity:1;filter:brightness(3)}30%{transform:scale(1.15) rotate(-6deg)}100%{opacity:0;transform:scale(.3) rotate(25deg) translateY(-40px)}}
@keyframes sneak{to{opacity:0;transform:translateX(-60px) scale(.7)}}
@keyframes pop{0%{transform:scale(.3)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.ball{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffe066 35%,#ff9d00 75%);box-shadow:0 0 16px 6px rgba(255,200,0,.8);z-index:250}
.fx{position:absolute;pointer-events:none;z-index:260}
.boom{width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,#fff6a0 0,#ffb000 35%,#ff5a1f 60%,rgba(120,60,40,0) 72%);animation:boom .7s ease-out forwards;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff;text-shadow:0 3px 0 #b33}
@keyframes boom{0%{transform:scale(.2);opacity:1}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1.4);opacity:0}}
.star{width:30px;height:30px;margin:-15px 0 0 -15px;font-size:30px;line-height:1;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.puff{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ddd 50%,rgba(220,220,220,0) 70%);animation:puff .6s forwards}
@keyframes puff{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
#house{position:absolute;left:0;top:318px;width:200px;height:210px;z-index:4}
#hpRow{position:absolute;left:34px;top:290px;width:130px;text-align:center;font-size:17px;color:#7a4a1a;font-weight:800;background:#fff8dc;border:2px solid #c9a46a;border-radius:10px;padding:2px 0;z-index:4}

/* 面板 */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:400;display:none;align-items:center;justify-content:center}
.mask.on{display:flex}
.panel{background:#fffdf3;border-radius:28px;padding:24px 34px;box-shadow:0 10px 0 #c9b67a,0 20px 40px rgba(0,0,0,.3);text-align:center;animation:panelIn .25s}
@keyframes panelIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.panel h3{margin:0 0 12px;font-size:34px;color:#4a3b20}
.chips{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 18px;font-size:40px;font-weight:800;color:#999}
.chip{min-width:62px;height:66px;padding:0 14px;border-radius:14px;border:4px solid #ccc;display:flex;align-items:center;justify-content:center;background:#fff;font-size:40px}
.chip.I{border-color:#4fb83a;color:#2f7d22}.chip.M{border-color:#a066dc;color:#6a2fb0}.chip.F{border-color:#f39a1e;color:#c45a00}.chip.W{border-color:#3d8fe0;color:#1f63ad}
.chip.R{border-color:#f5a623;background:linear-gradient(#fff3c4,#ffe08a);color:#a34d00;gap:10px}
.chip.R .hz{color:#222}
.chip.Q{border-style:dashed;color:#bbb}
.tones{display:flex;gap:18px;justify-content:center}
.tones button{width:130px;height:140px;border-radius:22px;background:linear-gradient(#fff,#ffe9c2);border:4px solid #f39a1e;box-shadow:0 6px 0 #c47a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tones button:active{transform:translateY(4px);box-shadow:0 2px 0 #c47a0a}
.tones button .tt{font-size:54px;font-weight:800;color:#c45a00;line-height:1.1}
.tones button .tn{font-size:20px;color:#8a6a3a;font-weight:700}
.tones svg{width:46px;height:26px}
.cancel{margin-top:18px;background:none;color:#999;font-size:20px;text-decoration:underline}
#banner{position:absolute;left:50%;top:200px;transform:translateX(-50%);z-index:350;display:none;min-width:520px}
#banner.on{display:block}
#banner .panel{padding:16px 30px 18px}
#banner .tag{display:inline-block;font-size:20px;font-weight:800;color:#fff;background:#f39a1e;border-radius:12px;padding:2px 14px;margin-bottom:6px}
#banner.bad .panel{box-shadow:0 10px 0 #d98c8c,0 20px 40px rgba(0,0,0,.3);background:#fff4f2}
#banner.bad .tag{background:#e0533c}
#banner .msg{font-size:28px;font-weight:800;color:#c0392b;margin-top:-4px}
#banner .chips{margin:6px 0 6px}
#toast{position:absolute;left:50%;top:172px;transform:translateX(-50%);background:rgba(40,40,40,.85);color:#fff;font-size:24px;padding:10px 24px;border-radius:18px;z-index:380;display:none;white-space:nowrap}
#toast.on{display:block;animation:panelIn .2s}
.endStars{font-size:72px;color:#ddd;letter-spacing:8px;margin:4px 0}
.endStars b{color:#ffb400;font-weight:400}
.review{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px;margin:8px auto 16px}
.review div{background:#fff;border:3px solid #f5a623;border-radius:14px;padding:4px 12px;font-size:26px;font-weight:800;color:#a34d00}
.review div .hz{color:#222;font-size:30px;margin-left:4px}
.prow{display:flex;gap:16px;justify-content:center;margin-top:8px}
#ghost{position:absolute;width:100px;height:110px;margin:-70px 0 0 -50px;pointer-events:none;z-index:500;display:none;opacity:.9}
#rotate{display:none;position:fixed;inset:0;background:#3c7a32;color:#fff;font-size:24px;align-items:center;justify-content:center;text-align:center;z-index:999;padding:30px}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="rotate"><div>📱↻<br><br>把平板/手机横过来玩吧</div></div>
<div id="stage">
  <!-- 首页 -->
  <div id="home" class="screen on">
    <div class="sky"></div>
    <div class="cloud" style="left:90px;top:60px;width:160px;height:50px"></div>
    <div class="cloud" style="left:1010px;top:110px;width:200px;height:56px"></div>
    <div class="title"><h1>拼音<span>花园</span>保卫战</h1><p>统编版一年级上册 · 字全部来自课本「识字表」 · 拼对了合体打跑偷字怪！</p></div>
    <div id="howto">
      <div class="st"><i>1</i><div>小怪兽举着<b>汉字牌</b>走过来，读一读它举的是什么字。</div></div>
      <div class="st"><i>2</i><div>在它那一行依次种下 <b style="color:#2f7d22">声母</b> → <b style="color:#6a2fb0">介母</b> → <b style="color:#c45a00">韵母</b>，再选好<b>声调</b>。</div></div>
      <div class="st"><i>3</i><div>拼对了，花朵<b>合体成大炮</b>把怪兽打跑；拼错了会“砰”地炸掉！不认识的字，点一下怪兽能看提示。</div></div>
    </div>
    <div id="homeBtns">
      <div class="seg spdSeg" id="spdSeg"><span>怪兽速度</span><button data-s="0">很慢</button><button data-s="1">慢</button><button data-s="2">中</button><button data-s="3">快</button><button data-s="4">很快</button></div>
      <button class="btn green" id="startBtn">开始游戏 ▶</button>
      <button class="iconbtn" id="muteBtn">🔊</button>
    </div>
    <div class="deco" style="left:70px" id="decoA"></div>
    <div class="deco" style="left:1100px;width:110px;height:130px;bottom:40px" id="decoB"></div>
  </div>

  <!-- 选关 -->
  <div id="levels" class="screen">
    <div class="sky" style="background:linear-gradient(#8fd16a,#6fb84e)"></div>
    <button class="btn small gray" id="lvBack">◀ 返回</button>
    <h2>选择关卡</h2>
    <div id="lvGrid"></div>
    <div class="seg" id="uptoSeg" style="position:absolute;left:50%;transform:translateX(-50%);top:640px;white-space:nowrap"><span>弟弟学到：</span><button data-u="4">拼音学完</button><button data-u="5">第五单元</button><button data-u="6">第六单元</button><button data-u="7">第七单元</button><button data-u="8">全部学完</button></div>
  </div>

  <!-- 游戏 -->
  <div id="game" class="screen">
    <div id="bar"><div id="tray"></div>
      <div id="side"><div style="display:flex;gap:10px;align-items:center"><div id="hearts"></div><button id="pauseBtn">⏸</button></div><button id="spdBtn"></button></div>
    </div>
    <div id="scene"></div>
    <div id="hpRow">保护小屋</div>
    <div id="prog"></div>
    <div id="house"></div>
    <svg id="hlSvg" viewBox="0 0 1280 720"><polygon id="rowPoly" points="" fill="rgba(255,255,170,.38)" stroke="#fff" stroke-width="4" stroke-dasharray="14 10" stroke-linejoin="round" style="display:none"/></svg>
    <div id="ents"></div>
    <div id="banner"><div class="panel"><div class="tag" id="bTag"></div><div class="chips" id="bChips"></div><div class="msg" id="bMsg"></div></div></div>
    <div id="toast"></div>
  </div>

  <div class="mask" id="toneMask"><div class="panel">
    <h3>给它选一个声调</h3>
    <div class="chips" id="tChips"></div>
    <div class="tones" id="tBtns"></div>
    <button class="cancel" id="tCancel">种错了？拔掉这朵花</button>
  </div></div>

  <div class="mask" id="pauseMask"><div class="panel" style="min-width:420px">
    <h3>暂停一下</h3>
    <div class="seg spdSeg" style="justify-content:center;margin:10px auto 0;width:max-content"><span>怪兽速度</span><button data-s="0">很慢</button><button data-s="1">慢</button><button data-s="2">中</button><button data-s="3">快</button><button data-s="4">很快</button></div>
    <div class="prow" style="flex-direction:column;align-items:center;gap:22px;margin-top:20px">
      <button class="btn green" id="resumeBtn">继续游戏</button>
      <div class="prow"><button class="btn small" id="restartBtn">重新开始</button><button class="btn small gray" id="quitBtn">选关</button></div>
    </div>
  </div></div>

  <div class="mask" id="endMask"><div class="panel" style="min-width:560px">
    <h3 id="endTitle"></h3>
    <div class="endStars" id="endStars"></div>

/* 2.5D 透视：row 0 在远处（上方），row 4 在近处（下方）；u=0 左边小屋一侧，u=1 右边 */
const ROWS=5,COLS=9,LT=192,LB=702,S0=0.72,S1=1,WF=1040,CXC=700;
const sv=v=>S0+(S1-S0)*v/ROWS;
const RT=(()=>{const hs=[...Array(ROWS)].map((_,r)=>sv(r+.5)),k=(LB-LT)/hs.reduce((a,b)=>a+b);const o=[LT];hs.forEach(h=>o.push(o[o.length-1]+h*k));return o})();
function vy(v){const r=Math.min(ROWS-1,Math.max(0,Math.floor(v)));return RT[r]+(RT[r+1]-RT[r])*(v-r)}
function proj(u,v){const s=sv(v);return {x:CXC+(u-.5)*WF*s,y:vy(v),s}}
function unproj(px,py){if(py<LT||py>=LB)return null;let r=0;while(r<ROWS-1&&py>=RT[r+1])r++;const v=r+(py-RT[r])/(RT[r+1]-RT[r]);return {u:(px-CXC)/(WF*sv(v))+.5,v,r}}
const cu=c=>(c+.5)/COLS, cellP=(r,c)=>proj(cu(c),r+.5);
function quad(u0,u1,v0,v1){const a=proj(u0,v0),b=proj(u1,v0),c=proj(u1,v1),d=proj(u0,v1);return `${a.x.toFixed(1)},${a.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)} ${d.x.toFixed(1)},${d.y.toFixed(1)}`}

let G=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pickReview(){
  const pool=shuffle(learned(LEVELS.slice(0,11).flatMap(L=>L.list),30));const chosen=[],cards={I:new Set,M:new Set,F:new Set,W:new Set},seen=new Set;
  for(const w of pool){if(chosen.length>=10)break;if(seen.has(w.c+w.s))continue;const d=decomp(w.s);if(!d)continue;
    const add=d.filter(([k,v])=>!cards[k].has(v));let tot=0;for(const k in cards)tot+=cards[k].size;if(tot+add.length>15)continue;
    add.forEach(([k,v])=>cards[k].add(v));chosen.push(w);seen.add(w.c+w.s)}
  const ord=(k,arr)=>{const base=k==='I'?INI:k==='F'?FIN:k==='W'?WHOLE:['i','u'];return [...arr].sort((a,b)=>base.indexOf(a)-base.indexOf(b))};
  return {words:chosen,I:ord('I',cards.I),M:ord('M',cards.M),F:ord('F',cards.F),W:ord('W',cards.W)};
}
function learned(list,min){
  const seen=new Set,uniq=list.filter(w=>{if(seen.has(w.c))return false;seen.add(w.c);return true});
  const ok=uniq.filter(w=>unitOf(w.c)<=SAVE.upto);
  if(ok.length>=min)return ok;
  const rest=uniq.filter(w=>unitOf(w.c)>SAVE.upto).sort((a,b)=>unitOf(a.c)-unitOf(b.c));
  return ok.concat(rest.slice(0,min-ok.length));
}

  G={lv:i,L,queue:words.slice(),total:words.length,mons:[],balls:[],grid:[...Array(ROWS)].map(()=>Array(COLS).fill(null)),pend:[...Array(ROWS)].map(()=>[]),
     hearts:3,beat:0,hints:0,miss:new Map,busy:false,paused:false,ended:false,spawnT:1.2,sp:SPEEDS[SAVE.speed],mcol:0,sel:null,firstTip:true};

}
function setSel(s){if(G.sel&&G.sel.el)G.sel.el.classList.remove('sel');G.sel=s;if(s&&s.el)s.el.classList.add('sel');if(!s)showRow(null)}

/* ---- 指针：点选 或 拖拽 ---- */
let drag=null;
function cardDown(e,card){
  if(!G||G.busy||G.paused||G.ended)return;e.preventDefault();ac();
  const wasSel=G.sel&&G.sel.el===card.el;setSel(card);sfx('sel');
  drag={card,x:e.clientX,y:e.clientY,moved:false,wasSel};
}
addEventListener('pointermove',e=>{
  if(!G||!$('game').classList.contains('on'))return;
  const p=toStage(e);
  if(drag){if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){drag.moved=true;const gh=$('ghost');gh.innerHTML=drag.card.type==='T'?`<div style="width:80px;height:92px;margin:0 auto">${SHOVEL}</div>`:ART[drag.card.type](disp(drag.card.val,0));gh.style.display='block'}
    if(drag.moved){const gh=$('ghost');gh.style.left=p.x+'px';gh.style.top=p.y+'px'}}
  if(G.sel&&G.sel.type!=='T'){const h=hit(p);showRow(h?h.row:null)}
});
addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;$('ghost').style.display='none';
  if(d.moved){const h=hit(toStage(e),d.card.type==='T');if(h)act(h);else setSel(null)}
  else if(d.wasSel)setSel(null);
});
stage.addEventListener('pointerdown',e=>{
  if(!G||!$('game').classList.contains('on')||G.busy||G.paused||G.ended)return;
  if(e.target.closest('#bar'))return;
  const h=hit(toStage(e),!!(G.sel&&G.sel.type==='T'));if(!h)return;ac();
  if(G.sel)act(h);else if(h.mon)showHint(h.mon);
});
function hit(p,shovel){
  if(shovel){for(let r=ROWS-1;r>=0;r--)for(let c=0;c<COLS;c++){const pl=G.grid[r][c];if(!pl)continue;const q=cellP(r,c);if(Math.abs(p.x-q.x)<46*q.s&&p.y>q.y-104*q.s&&p.y<q.y+12*q.s)return {row:r,col:c,plant:pl}}}
  const ms=G.mons.filter(m=>m.alive).sort((a,b)=>b.row-a.row);
  for(const m of ms){const q=proj(m.u,m.row+.5);if(Math.abs(p.x-q.x)<54*q.s&&p.y>q.y-126*q.s&&p.y<q.y+12*q.s)return {row:m.row,col:Math.floor(m.u*COLS),mon:m}}
  const q=unproj(p.x,p.y);if(!q||q.u<0||q.u>=1)return null;
  return {row:q.r,col:Math.floor(q.u*COLS)};
}
function act(h){
  const s=G.sel;setSel(null);if(!s)return;
  if(s.type==='T'){const p=h.plant||(h.col>=0&&h.col<COLS?G.grid[h.row][h.col]:null);if(p){if(p.pending)clearPend(h.row,true);else removePlant(p,true);sfx('pop')}else toast('点一下要铲掉的花');return}
  plantAt(h.row,s);
}

/* ---- 种植 ---- */
function firstFree(r){for(let c=0;c<COLS;c++)if(!G.grid[r][c])return c;return -1}
function makePlant(r,c,type,val){
  const el=document.createElement('div');el.className='plant new';const q=cellP(r,c);el.style.left=(q.x-50)+'px';el.style.top=(q.y-104)+'px';el.style.transform=`scale(${q.s.toFixed(3)})`;el.style.zIndex=10+r*10+2;
  el.innerHTML=ART[type](disp(val,0));$('ents').appendChild(el);setTimeout(()=>el.classList.remove('new'),400);
  const p={row:r,col:c,type,val,tone:0,el,hp:2.5,pending:true};G.grid[r][c]=p;return p;
}
function removePlant(p,puffIt){if(G.grid[p.row][p.col]===p)G.grid[p.row][p.col]=null;p.el.remove();if(puffIt){const q=cellP(p.row,p.col);fx('puff',q.x,q.y-34*q.s)}}
function clearPend(r,puffIt){G.pend[r].forEach(p=>removePlant(p,puffIt));G.pend[r]=[]}
function plantAt(r,card){
  const pend=G.pend[r],types=pend.map(p=>p.type).join(''),t=card.type;
  const ok=(types===''&&(t==='I'||t==='F'||t==='W'))||(types==='I'&&(t==='M'||t==='F'))||(types==='IM'&&t==='F');
  const c=firstFree(r);if(c<0){toast('这一行种满啦，用铲子铲掉一些吧');return}
  const p=makePlant(r,c,t,card.val);pend.push(p);sfx('pop');
  if(!ok){
    let msg='顺序不对哦：先种声母，再种介母，最后种韵母';
    if(t==='M'&&types==='')msg='介母要种在声母后面哦';
    else if((t==='I'||t==='W')&&types)msg='这一行已经开始拼了，新的音节要重新开始';
    fail(r,msg,null);return}
  if(t==='F'||t==='W')openTone(r);
  else if(G.firstTip&&t==='I'){G.firstTip=false;toast(G.L.M&&G.L.M.length?'接着在同一行种介母或韵母':'接着在同一行种韵母',2200)}
}
function chipsHTML(pend,last){return pend.map((p,i)=>`<div class="chip ${p.type} py">${pyT(disp(p.val,i===pend.length-1?last:0))}</div>`).join('<span>+</span>')}

/* ---- 声调 ---- */
function openTone(r){
  G.busy=true;const pend=G.pend[r],fin=pend[pend.length-1];
  $('tChips').innerHTML=chipsHTML(pend,0);
  const b=$('tBtns');b.innerHTML='';
  [1,2,3,4].forEach(t=>{const bt=document.createElement('button');bt.innerHTML=`<div class="tt py">${P(fin.val,t)}</div>${TONE_ICON[t-1]}<div class="tn">${TONE_NAME[t-1]}</div>`;
    bt.onclick=()=>{$('toneMask').classList.remove('on');sfx('sel');fin.tone=t;fin.el.innerHTML=ART[fin.type](disp(fin.val,t));evaluate(r,t)};b.appendChild(bt)});
  $('tCancel').onclick=()=>{$('toneMask').classList.remove('on');pend.pop();removePlant(fin,true);G.busy=false};
  $('toneMask').classList.add('on');
}

/* ---- 判定 ---- */
function evaluate(r,t){
  const pend=G.pend[r],s=pend.map(p=>p.val).join('');
  const alive=G.mons.filter(m=>m.alive&&!m.targeted);
  const c=alive.filter(m=>m.w.s===s&&m.w.t===t).sort((a,b)=>((a.row===r?0:1)-(b.row===r?0:1))||(a.x-b.x));
  if(c.length){success(r,c[0],t);return}
  const same=alive.filter(m=>m.row===r).sort((a,b)=>a.x-b.x);
  const ref=same[0]||alive.slice().sort((a,b)=>a.x-b.x)[0];
  const mine=P(s,t);let msg;
  if(ref&&ref.w.s===s)msg=`你拼的是 <span class="py">${mine}</span>，「<span class="hz">${ref.w.c}</span>」的声调不对哦`;
  else if(ref)msg=`你拼的是 <span class="py">${mine}</span>，不是「<span class="hz">${ref.w.c}</span>」，再读一读`;
  else msg=`你拼的是 <span class="py">${mine}</span>，现在没有这个音的怪兽`;
  if(ref)addMiss(ref.w);
  fail(r,msg,t);
}
function addMiss(w){G.miss.set(w.c+w.s+w.t,w)}
function success(r,m,t){
  m.targeted=true;G.busy=true;sfx('ok');
  const pend=G.pend[r],n=pend.length,s=m.w.s;
  const tag=WHOLE_TAG.includes(s)?'整体认读音节':n===3?'三拼音节':n===2?'两拼音节':'韵母自成音节';
  showBanner(false,'拼对啦！'+tag,chipsHTML(pend,t)+`<span>→</span><div class="chip R"><span class="py">${P(s,t)}</span><span class="hz">${m.w.c}</span></div>`,'');
  setTimeout(()=>{
    hideBanner();
    const first=pend[0];pend.slice(1).forEach(p=>removePlant(p,true));G.pend[r]=[];
    first.pending=false;first.type='C';first.hp=5;first.el.classList.add('new');
    first.el.innerHTML=artCannon()+`<div class="lab"><span class="py">${P(s,t)}</span><span class="hz">${m.w.c}</span></div>`;
    {const q=cellP(first.row,first.col);for(let k=0;k<6;k++)fx('star',q.x,q.y-50*q.s,'✨')}
    G.busy=false;
    setTimeout(()=>shoot(first,m),280);
  },1300);
}
function fail(r,msg,t){
  G.busy=true;
  const pend=G.pend[r];
  showBanner(true,'哎呀，拼错了！',chipsHTML(pend,t||0)+'<span>→</span><span style="font-size:46px">💥</span>',msg);
  setTimeout(()=>{sfx('boom');pend.forEach(p=>{const q=cellP(p.row,p.col);fx('boom',q.x,q.y-44*q.s,'砰!');removePlant(p,false)});G.pend[r]=[]},700);
  setTimeout(()=>{hideBanner();G.busy=false},2300);
}
function showBanner(bad,tag,chips,msg){$('toast').classList.remove('on');const b=$('banner');b.classList.toggle('bad',bad);$('bTag').textContent=tag;$('bChips').innerHTML=chips;$('bMsg').innerHTML=msg;$('bMsg').style.display=msg?'block':'none';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');b.firstElementChild.style.animation='none';void b.offsetWidth;b.firstElementChild.style.animation=''}
function hideBanner(){$('banner').classList.remove('on')}
let toastT=0;function toast(s,ms){const t=$('toast');t.innerHTML=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||1800)}
function fx(kind,x,y,txt){
  if(kind==='star'){const e=document.createElement('div');e.className='fx star';e.textContent=txt||'⭐';e.style.left=x+'px';e.style.top=y+'px';const a=Math.random()*6.28,d=50+Math.random()*60;e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');$('ents').appendChild(e);setTimeout(()=>e.remove(),850);return}
  const e=document.createElement('div');e.className='fx '+kind;e.style.left=x+'px';e.style.top=y+'px';if(txt)e.textContent=txt;$('ents').appendChild(e);setTimeout(()=>e.remove(),800);
}

/* ---- 怪兽 ---- */
function spawn(){
  const w=G.queue.shift();const cnt=Array(ROWS).fill(0),near=Array(ROWS).fill(false);
  G.mons.forEach(m=>{if(m.alive){cnt[m.row]++;if(m.u>0.9)near[m.row]=true}});
  let rows=[...Array(ROWS).keys()].filter(r=>!near[r]);if(!rows.length)rows=[...Array(ROWS).keys()];
  const mn=Math.min(...rows.map(r=>cnt[r]));rows=rows.filter(r=>cnt[r]===mn);const row=rows[Math.random()*rows.length|0];
  const el=document.createElement('div');el.className='mon';el.style.zIndex=10+row*10+5;
  const [mc,md]=monCol(G.mcol);el.style.setProperty('--mc',mc);el.style.setProperty('--md',md);
  el.innerHTML=`<div class="hint py"></div><div class="mi">${artMon(G.mcol++)}<div class="sign"><b class="hz">${w.c}</b>${w.e?`<i>${w.e}</i>`:''}</div></div>`;
  $('ents').appendChild(el);
  const m={w,row,u:1.06,el,alive:true,targeted:false,eat:null,hintT:0};G.mons.push(m);placeMon(m);
}
function placeMon(m){const q=proj(m.u,m.row+.5);m.el.style.left=(q.x-55)+'px';m.el.style.top=(q.y-124)+'px';m.el.style.transform=`scale(${(q.s*.96).toFixed(3)})`}
function showHint(m){
  const h=m.el.querySelector('.hint');h.textContent=P(m.w.s,m.w.t);h.classList.remove('on');void h.offsetWidth;h.classList.add('on');m.hintT=2.6;
  G.hints++;addMiss(m.w);sfx('sel');
}
function shoot(from,m){
  const el=document.createElement('div');el.className='ball';$('ents').appendChild(el);
  const q=cellP(from.row,from.col);const b={x:q.x+42*q.s,y:q.y-54*q.s,m,el};G.balls.push(b);el.style.left=b.x+'px';el.style.top=b.y+'px';sfx('pop');
}
function killMon(m){
  m.alive=false;m.el.classList.add('die');sfx('hit');
  {const q=proj(m.u,m.row+.5);for(let k=0;k<8;k++)fx('star',q.x,q.y-50*q.s)}
  G.beat++;updHUD();setTimeout(()=>m.el.remove(),650);
}

/* ---- 主循环 ---- */
let last=performance.now();
function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;if(G&&!G.busy&&!G.paused&&!G.ended&&$('game').classList.contains('on'))update(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function update(dt){
  const sp=G.sp,speed=1.1/sp.cross;
  const alive=G.mons.filter(m=>m.alive).length;
  if(G.queue.length){if(alive===0&&G.spawnT>1.5)G.spawnT=1.5;G.spawnT-=dt;if(G.spawnT<=0&&alive<sp.max){spawn();G.spawnT=sp.interval}}
  for(const m of G.mons){
    if(!m.alive)continue;
    if(m.hintT>0){m.hintT-=dt;if(m.hintT<=0)m.el.querySelector('.hint').classList.remove('on')}
    if(m.targeted){continue}
    // 吃花
    let target=null;for(let c=COLS-1;c>=0;c--){const p=G.grid[m.row][c];if(p&&cu(c)<m.u&&m.u-cu(c)<0.058){target=p;break}}
    if(target){if(m.eat!==target){m.eat=target;m.el.classList.add('eating');target.el.classList.add('eat')}
      target.hp-=dt;if(target.hp<=0){const wasPend=target.pending;removePlant(target,true);if(wasPend)clearPend(m.row,true);m.eat=null;m.el.classList.remove('eating');sfx('ouch')}
      continue}
    if(m.eat){m.eat=null;m.el.classList.remove('eating')}
    m.u-=speed*dt;placeMon(m);
    if(m.u<-0.045){m.alive=false;m.el.classList.add('home');setTimeout(()=>m.el.remove(),650);G.hearts--;addMiss(m.w);sfx('ouch');
      toast(`「<span class="hz">${m.w.c}</span>」溜进小屋了！它读 <span class="py">${P(m.w.s,m.w.t)}</span>`,2600);updHUD();
      if(G.hearts<=0){endGame(false);return}}
  }
  for(const b of G.balls.slice()){
    const bq=proj(b.m.u,b.m.row+.5),tx=bq.x,ty=bq.y-56*bq.s,dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy),st=1100*dt;
    if(d<=st+10){b.el.remove();G.balls.splice(G.balls.indexOf(b),1);killMon(b.m)}else{b.x+=dx/d*st;b.y+=dy/d*st;b.el.style.left=b.x+'px';b.el.style.top=b.y+'px'}
  }
  if(!G.queue.length&&!G.mons.some(m=>m.alive)&&!G.balls.length&&!G.ended){G.ended=true;setTimeout(()=>endGame(true),900)}
}

/* ---- 暂停 / 结束 ---- */
$('pauseBtn').onclick=()=>{if(!G||G.ended)return;G.paused=true;setSel(null);$('pauseMask').classList.add('on')};
$('resumeBtn').onclick=()=>{G.paused=false;$('pauseMask').classList.remove('on')};
$('restartBtn').onclick=()=>startLevel(G.lv);
$('quitBtn').onclick=()=>{$('pauseMask').classList.remove('on');G.ended=true;renderLevels();show('levels')};
$('againBtn').onclick=()=>startLevel(G.lv);
$('nextBtn').onclick=()=>startLevel(Math.min(G.lv+1,LEVELS.length-1));
$('endLvBtn').onclick=()=>{$('endMask').classList.remove('on');renderLevels();show('levels')};
function endGame(win){
  G.ended=true;setSel(null);
  let stars=0;
  if(win){stars=G.hearts;if(G.hints>2)stars=Math.max(1,stars-1);SAVE.stars[G.lv]=Math.max(SAVE.stars[G.lv]||0,stars);save();sfx('win')}else sfx('lose');
  $('endTitle').textContent=win?'🎉 花园保住啦！':'😵 怪兽溜进小屋了…';
  $('endStars').innerHTML=win?'<b>★</b>'.repeat(stars)+'☆'.repeat(3-stars):'';
  $('endInfo').textContent=win?`打跑了 ${G.beat} 只偷字怪`+(G.hints?`，看了 ${G.hints} 次提示`:''):`打跑了 ${G.beat} / ${G.total} 只，再来一次一定行！`;
  const rev=[...G.miss.values()];$('endRevWrap').style.display=rev.length?'block':'none';
  $('endRev').innerHTML=rev.map(w=>`<div><span class="py">${P(w.s,w.t)}</span><span class="hz">${w.c}</span>${WRITE.includes(w.c)?'<small style="font-size:16px;color:#3d8fe0;margin-left:4px">✏️会写</small>':''}</div>`).join('');
  $('nextBtn').style.display=win&&G.lv<LEVELS.length-1?'':'none';
  $('endMask').classList.add('on');
}
window.__T={proj,cellP,RT,SPEEDS,setSpeed,UNITS,WRITE,unitOf,LEVELS,decomp,disp,P,get G(){return G},startLevel,plantAt,evaluate};
</script>
